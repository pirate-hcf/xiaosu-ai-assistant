server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: xiaosu
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:11MB}
      resolve-lazily: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/xiaosu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:xiaosu}
    password: ${SPRING_DATASOURCE_PASSWORD:xiaosu}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-handlers-package: com.xiaosu.mapper.typehandler
  configuration:
    map-underscore-to-camel-case: true

logging:
  file:
    path: ${LOG_DIR:logs}

xiaosu:
  llm:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    chat-model: ${LLM_CHAT_MODEL:}
    embedding-model: ${LLM_EMBEDDING_MODEL:}
    timeout: ${LLM_TIMEOUT_SECONDS:20}s
  dingtalk:
    client-id: ${DINGTALK_CLIENT_ID:}
    client-secret: ${DINGTALK_CLIENT_SECRET:}
    card-template-id: ${DINGTALK_CARD_TEMPLATE_ID:}
  storage:
    upload-directory: ${UPLOAD_DIR:uploads}
    max-file-size: ${MAX_UPLOAD_SIZE:10MB}
  mock-data:
    directory: ${MOCK_DATA_DIR:data/mock}
  knowledge:
    chunking:
      max-tokens: ${CHUNK_MAX_TOKENS:400}
      overlap-tokens: ${CHUNK_OVERLAP_TOKENS:60}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
